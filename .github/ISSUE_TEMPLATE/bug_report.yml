name: Bug report
description: Something in SentinelScope behaves incorrectly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Found a security vulnerability** (for example an SSRF bypass)? Please don't file it here —
        use [private vulnerability reporting](https://github.com/mehmet-yuksell/sentinelscope-security/security/advisories/new) instead (see SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The target you analyzed helps a lot — only include it if it is public and you are comfortable sharing it.
      placeholder: |
        1. Analyze `example.com`
        2. Open the TLS tab
        3. ...
    validations:
      required: true

  - type: dropdown
    id: target-kind
    attributes:
      label: Target type
      options:
        - Domain
        - URL
        - IPv4 address
        - IPv6 address
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Where did this happen?
      options:
        - Live demo (sentinelscope-nu.vercel.app)
        - Local development (npm run dev)
        - Docker / Docker Compose
        - My own Vercel deployment
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release (e.g. v1.0.0) or commit SHA, if you are self-hosting.

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Remove API keys, tokens and other secrets before pasting.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: This is not just a provider showing "Unavailable" because its API key is not configured (that is expected behavior).
          required: true
